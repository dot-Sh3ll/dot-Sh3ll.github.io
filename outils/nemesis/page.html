<!DOCTYPE html>
<html lang="{{_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{titre}}
<meta name="description" {{description}}>
<!--polices:Rajdhani,Source Sans 3--><!--/polices-->
<style>
/* Plan : barre d'onglets collante, sommaire à gauche avec progression, colonne de lecture à droite.
   Couleurs : complexe sombre, vert acide (Intrus), orange d'alerte. Sections A, B, C en vert, violet, rouge comme sur l'aide de jeu. */
:root{--app-accent:var(--accent);--app-accent-ink:var(--accent-ink);--app-piste:var(--sunk);--app-onglet:var(--muted);
  --bg:#eef0ec; --surface:#fbfcfa; --sunk:#e1e5df; --ink:#1b211d; --muted:#5b665e; --line:#c9d1c8;
  --accent:#4b7711; --accent-ink:#ffffff; --terra:#b4491c; --terra-soft:#f7e3d8;
  --ok:#2c7a3f; --ok-soft:#e1f1e3; --bad:#b3372f; --bad-soft:#f8e1dd;
  --secA:#27795a; --secB:#7a4fc4; --secC:#c43a3a; --secX:#656d68;
  --itr:#c8342f; --itv:#317931; --itj:#d6a11f;
  --display:"Rajdhani","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --top:0px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1311; --surface:#171d19; --sunk:#111613; --ink:#e3eae4; --muted:#9aa89d; --line:#2c3630;
  --accent:#9bd33a; --accent-ink:#0d1509; --terra:#ff8a4c; --terra-soft:#3a2214;
  --ok:#6fcf8a; --ok-soft:#16301d; --bad:#f08a80; --bad-soft:#3b1a17;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1311; --surface:#171d19; --sunk:#111613; --ink:#e3eae4; --muted:#9aa89d; --line:#2c3630;
    --accent:#9bd33a; --accent-ink:#0d1509; --terra:#ff8a4c; --terra-soft:#3a2214;
    --ok:#6fcf8a; --ok-soft:#16301d; --bad:#f08a80; --bad-soft:#3b1a17;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:7px}
button:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button[disabled]{opacity:.45;cursor:not-allowed}
button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
input[type=number]{width:74px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);vertical-align:-3px}

/* ---------- en-tête de l'appli ---------- */
.apphead{position:sticky;top:var(--sitehead-h,0px);z-index:8;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.apphead .in{max-width:var(--site-w,1080px);margin:0 auto;padding:10px var(--site-pad,20px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.apphead .title{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.1;margin:0;display:flex;align-items:baseline;gap:8px}
.apphead .title small{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--terra)}
.apphead .lrmp-onglets{margin-left:auto;width:auto}
.themebtn{border-radius:999px;width:36px;height:36px;padding:0;display:grid;place-items:center}
@media (max-width:640px){.apphead .title{font-size:18px}.apphead .title small{display:none}.apphead .in{gap:8px;padding-top:8px;padding-bottom:8px}.themebtn{margin-left:auto;width:32px;height:32px}.apphead .lrmp-onglets{order:3;margin-left:0;width:100%}}

.tab{display:none}.tab.on{display:block}

/* ---------- tutoriel : sommaire + lecture ---------- */
.learn{max-width:var(--site-w,1080px);margin:0 auto;padding:0 var(--site-pad,20px);display:grid;grid-template-columns:260px minmax(0,1fr);gap:clamp(16px,3vw,40px)}
nav.toc{position:sticky;top:calc(var(--sitehead-h,0px) + 64px);align-self:start;max-height:calc(100vh - var(--sitehead-h,0px) - 76px);overflow:auto;padding:22px 4px 20px 0}
.toc .brand{font-family:var(--display);font-size:19px;font-weight:600;margin:0 6px 2px}
.toc .merci{font-size:12px;line-height:1.45;color:var(--muted);margin:0 6px 12px}
.toc .brand small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.bar{height:6px;background:var(--sunk);border-radius:3px;margin:12px 6px 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--terra);width:0;transition:width .3s}
.barlabel{font-size:13px;color:var(--muted);margin:0 6px 10px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.toc a{display:flex;gap:9px;align-items:baseline;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.3}
.toc a:hover{background:var(--sunk)}
.toc a.on{background:var(--accent);color:var(--accent-ink)}
.toc a .n{font-variant-numeric:tabular-nums;font-size:12px;width:18px;color:var(--muted);flex:none}
.toc a.on .n{color:inherit}
.toc a .tick{margin-left:auto;font-size:12px;font-weight:700;color:var(--ok)}
.toc a.on .tick{color:inherit}
.toc .part{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--terra);font-weight:700;margin:14px 8px 3px}
.tocbtn{display:none;width:100%;margin:10px 0 0}
@media (max-width:860px){
  .learn{grid-template-columns:1fr}
  nav.toc{position:static;max-height:none;padding:16px 0 0}
  .toc ol{display:none}.toc.open ol{display:flex}
  .tocbtn{display:block}
}
main.read{padding:26px 0 90px;min-width:0}
section.ch{display:none;max-width:760px}
section.ch.on{display:block}
.eyebrow{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--terra);font-weight:700}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,4vw,38px);line-height:1.12;margin:4px 0 10px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:23px;margin:34px 0 10px;text-wrap:balance}
h3{font-size:17px;margin:18px 0 4px}
p{margin:0 0 12px}
.lead{font-size:19px;color:var(--muted)}
ul,ol{padding-left:22px;margin:0 0 12px}
li{margin-bottom:5px}
ol.rules{list-style:none;padding:0;counter-reset:r;display:flex;flex-direction:column;gap:8px}
ol.rules>li{counter-increment:r;position:relative;padding:10px 14px 10px 50px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:0}
ol.rules>li::before{content:counter(r);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--sunk);color:var(--terra);font-weight:700;font-size:14px;display:grid;place-items:center}
.note{border-left:4px solid var(--terra);background:var(--terra-soft);padding:10px 14px;border-radius:0 7px 7px 0;margin:14px 0}
.note b:first-child{color:var(--terra)}
.ex{border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface));padding:10px 14px;border-radius:0 7px 7px 0;margin:14px 0}
.ex b:first-child{color:var(--accent)}
.fig{margin:16px 0;padding:12px 14px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.fig svg{display:block;width:100%;height:auto;max-width:680px;margin:0 auto;font-family:var(--body)}
.fig figcaption{font-size:14px;line-height:1.45;color:var(--muted);margin-top:8px}
.f-room{fill:var(--sunk);stroke:var(--line);stroke-width:1}.f-cor{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.f-cor-open{fill:none;stroke:var(--muted);stroke-width:1}.f-cor-end{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}
.f-renf{fill:color-mix(in srgb,var(--accent) 18%,var(--surface));stroke:var(--accent);stroke-width:1.5}
.f-seuil{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}.f-porte{fill:var(--ink)}
.f-int{fill:var(--terra-soft);stroke:var(--terra);stroke-width:1.5}.f-intt{fill:var(--terra);font-weight:700;font-size:14px}
.f-me{fill:var(--accent)}.f-met{fill:var(--accent-ink);font-weight:700;font-size:13px}
.f-path{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}.f-int-path{stroke:var(--terra)}
.f-mk{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.f-mk2{stroke:var(--terra)}
.f-box{fill:var(--terra-soft);stroke:var(--terra);stroke-width:1}.f-vide{fill:none;stroke:var(--muted);stroke-dasharray:4 3}
.fth{fill:var(--ink);font-size:15px;font-weight:600}.fts{fill:var(--muted);font-size:13px}.f-warn{fill:var(--terra);font-weight:600}
.f-phase{fill:color-mix(in srgb,var(--accent) 12%,var(--surface));stroke:var(--accent);stroke-width:1}.f-arr{stroke:var(--muted);stroke-width:1.5}.f-mk3{stroke:var(--muted)}
.f-case{fill:var(--surface);stroke:var(--line);stroke-width:1}.f-cur{fill:var(--accent);stroke:var(--accent)}.f-curt{fill:var(--accent-ink);font-size:13px;font-weight:700}
.f-tok{fill:var(--ink)}.f-tokt{fill:var(--surface);font-size:12px;font-weight:700}.f-tokb{fill:var(--terra)}.f-tokbt{fill:var(--surface)}
.f-cube{fill:var(--terra)}.f-cube-old{fill:none;stroke:var(--terra);stroke-dasharray:3 2}.f-bout{stroke:var(--terra);stroke-width:2}.f-crane{stroke:var(--muted)}
.f-armure{fill:var(--sunk);stroke:var(--ink);stroke-width:1.5}.f-armt{fill:var(--ink);font-size:13px;font-weight:600}.f-detruite{fill:none;stroke:var(--muted);stroke-dasharray:4 3}.f-detruitet{fill:var(--muted);font-weight:400;text-decoration:line-through}
.f-sep{stroke:var(--line);stroke-width:1}.f-lead{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.faq{border:1px solid var(--line);border-left:4px solid var(--terra);background:var(--surface);border-radius:0 8px 8px 0;padding:10px 14px 4px;margin:14px 0}
.faq h3{margin:0 0 6px;font-size:15px;color:var(--terra)}
.faq h3 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.faq ul{margin:0;padding-left:18px}
.faq li{margin:0 0 8px}
.tw{overflow-x:auto;margin:10px 0 16px}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface)}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--sunk);font-weight:700}
td.c,th.c{text-align:center}
.en{display:none}

/* atelier */
.lab{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:9px;padding:16px 18px;margin:20px 0}
.lab>h3:first-child{margin-top:0;font-family:var(--display);font-weight:600;font-size:20px}
.lab .hint{font-size:14.5px;color:var(--muted);margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.f{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--muted);font-weight:600}
.f input,.f select{color:var(--ink);font-weight:400}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:15px;padding:4px 2px}
.out{margin-top:12px;padding:10px 12px;background:var(--sunk);border-radius:7px;min-height:22px}
.out.ok{background:var(--ok-soft)} .out.bad{background:var(--bad-soft)}
.big{font-family:var(--display);font-size:26px;font-weight:600}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 12px;font-weight:600}
.seg button.sel{background:var(--accent);color:var(--accent-ink);box-shadow:none}

/* cas pratiques et quiz */
.qs{display:flex;flex-direction:column;gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 15px}
.q .qt{font-weight:600;margin-bottom:8px}
.q.case{border-left:4px solid var(--terra)}
.q .tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--terra);margin-bottom:3px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left;padding:8px 12px}
.opts button.right{border-color:var(--ok);background:var(--ok-soft)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{margin-top:9px;font-size:15.5px;padding:8px 11px;border-radius:7px;background:var(--sunk)}
.score{margin-top:12px;font-weight:600}
.done-banner{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}

/* aide-mémoire et décompte */
.page{max-width:var(--site-w,1080px);margin:0 auto;padding:22px var(--site-pad,20px) 90px}
.page h1{margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;border-top:5px solid var(--bc,var(--line))}
.bcard .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bcard .nm{font-weight:700;line-height:1.2}
.bcard .meta{display:flex;gap:5px;align-items:center;flex:none}
.bcard .fx{font-size:14.5px}
.bcard .set{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.slots{font-size:12.5px;color:var(--muted)}
.filters2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Nemesis */
h1,h2,.apphead .title,.toc .brand,.lab>h3:first-child,.big{letter-spacing:.01em}
h1{font-weight:700;text-transform:uppercase}
.it{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.35);vertical-align:-1px;margin-right:2px}
.it-r{background:var(--itr)}.it-v{background:var(--itv)}.it-j{background:var(--itj)}
.sec{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:5px;color:#fff;font-weight:700;font-size:13px}
.sec-A{background:var(--secA)}.sec-B{background:var(--secB)}.sec-C{background:var(--secC)}.sec-x{background:var(--secX)}
.pic{font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;border-top:5px solid var(--rc,var(--line))}
.rcard .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rcard .nm{font-weight:700;line-height:1.2}
.rcard .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rcard .fx{font-size:14.5px}
.rcard ul{font-size:13.5px;color:var(--muted);margin:2px 0 0;padding-left:18px}
.rcard li{margin-bottom:2px}
/* ateliers */
.tok{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:50%;font-weight:700;font-size:12px;border:2px solid var(--line);background:var(--surface)}
.tok.reine{border-color:#b8860b;color:#b8860b}.tok.guerrier{border-color:var(--terra);color:var(--terra)}.tok.adulte{border-color:var(--accent);color:var(--accent)}.tok.larve{border-color:var(--muted);color:var(--muted)}.tok.vierge{border-style:dashed;color:var(--muted)}
.bag{display:flex;flex-wrap:wrap;gap:5px;padding:10px;border:2px dashed var(--line);border-radius:12px;min-height:52px;margin:8px 0}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin:8px 0;font-size:14px}
.counts div{background:var(--sunk);border-radius:7px;padding:6px 9px}
.counts b{font-size:18px}
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:440px;margin:10px auto}
.cor{border:2px solid var(--line);border-radius:8px;padding:6px;min-height:64px;text-align:center;font-size:13px;background:var(--surface)}
.cor .num{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.cor.hit{border-color:var(--terra);box-shadow:0 0 0 2px var(--terra)}
.cor.reinf{opacity:.6;border-style:dashed}
.room{border:2px solid var(--accent);border-radius:12px;display:grid;place-items:center;font-weight:700;min-height:64px;text-align:center;font-size:13px;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.empty{visibility:hidden}
.dice{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.dice button{min-width:52px;font-weight:700}
.foes{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.foe{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);min-width:118px;text-align:center}
.foe.dead{opacity:.4;text-decoration:line-through}
.foe .h{font-size:13px;color:var(--muted)}
.foe .row{justify-content:center;margin-top:4px}
.cubes{letter-spacing:2px;color:var(--terra)}
.meter{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--bad)}
@media print{.apphead,nav.toc,.pager,.lab button{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
<!--PARTAGE:expliquer.css-->
</style>
</head>
<body>
<header class="apphead"><div class="in">
  <p class="title">Nemesis: Retaliation</p>
  <div class="lrmp-onglets" role="tablist" aria-label="Sections">
    <button type="button" role="tab" {{onglet_apprendre}}
    <button type="button" role="tab" {{onglet_expliquer}}
    <button type="button" role="tab" {{onglet_salles}}
    <button type="button" role="tab" {{onglet_aide}}
  </div>
  <button type="button" class="themebtn ghost" id="theme" {{bouton_theme}}>◐</button>
</div></header>

<div class="tab on" id="tab-learn"><div class="learn">
  <nav class="toc" id="toc" {{sommaire_aria}}>
    {{marque}}
    {{merci_faq}}
    <div class="bar"><i id="bar"></i></div>
    <p class="barlabel" id="barlabel"></p>
    <button type="button" class="tocbtn" id="tocbtn" {{bouton_sommaire}}
    <ol id="toclist"></ol>
  </nav>
  <main class="read" id="read"></main>
</div></div>

<div class="tab" id="tab-expliquer"><div class="page lrmp-ex"><div class="lrmp-ex-tete"><h1>{{ex_titre}}</h1><p>{{ex_intro}}</p><p class="lrmp-ex-duree">{{ex_duree}}</p></div><div class="lrmp-ex-boite" id="ex-boite"></div></div></div>
<script><!--PARTAGE:expliquer.js-->
<!--CONTENU:expliquer-->
lrmpExpliquer(document.getElementById('ex-boite'),EXPL);</script>
<div class="tab" id="tab-aide"><div class="page" id="aide"></div></div>
<div class="tab" id="tab-salles"><div class="page" id="sallespage"></div></div>
<script>
(function(){
"use strict";
/* ---------- utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rnd=n=>Math.floor(Math.random()*n);

/* ---------- petits pictogrammes ---------- */

{{objet_noms}}
const ordi=`<span class="pic" {{ordinateur_titre}}>💻</span>`;
const sect=s=>`<span class="sec sec-${s==='?'?'x':s}">${s}</span>`;

/* ---------- salles (aide de jeu Salles de la boîte) ----------

/* ---------- fiches de salles (chapitre et onglet Salles) ---------- */
const SC_COL={A:'var(--secA)',B:'var(--secB)',C:'var(--secC)','?':'var(--secX)'};
const roomCard=x=>`<div class="rcard" style="--rc:${SC_COL[x.s]}"><div class="hd"><div class="nm">${x.fr}</div>${sect(x.s)}</div>
 <div class="meta">{{salle_numero}}${x.obj?`<span>${[...x.obj].map(it).join('')}</span>`:''}${x.ic.map(k=>`<span>${k==='ordi'?ordi+' ':''}${ICN[k]}</span>`).join('')}</div>
 <div class="fx">${x.fx}</div>${x.pr.length?`<ul>${x.pr.map(p=>`<li>${p}</li>`).join('')}</ul>`:''}</div>`;

/* ---------- tutoriel ---------- */
const ST={{sauvegarde_lire}}{done:{},cur:CH[0].id,q:{}});ST.done=ST.done||{};ST.q=ST.q||{};
const saveST=()=>{{sauvegarde_ecrire}}ST);
function progress(){const d=CH.filter(c=>ST.done[c.id]).length;$('#bar').style.width=(100*d/CH.length)+'%';{{progression}}}
function toc(){let h='',part='';CH.forEach((c,i)=>{if(c.part!==part){part=c.part;h+=`<li class="part">${part}</li>`}h+=`<li><a href="#${c.id}" data-id="${c.id}" class="${ST.cur===c.id?'on':''}"><span class="n">${i+1}</span><span>${c.t}</span>${ST.done[c.id]?{{valide_aria}}:''}</a></li>`});$('#toclist').innerHTML=h;
 $$('#toclist a').forEach(a=>a.onclick=e=>{e.preventDefault();show(a.dataset.id,true);$('#toc').classList.remove('open');$('#tocbtn').setAttribute('aria-expanded','false');{{sommaire_fermer}}
function qBlock(list,kind,cid){return `<div class="qs">${list.map((x,i)=>{const key=`${cid}:${kind}${i}`,st=ST.q[key];return `<div class="q${kind==='c'?' case':''}" data-k="${key}" data-a="${x.a}">${kind==='c'?{{cas_question}}:''}<div class="qt">${x.q}</div><div class="opts">${x.o.map((o,j)=>`<button type="button" data-j="${j}" class="${st&&st.picked&&st.picked.includes(j)?(j===x.a?'right':'wrong'):''}">${o}</button>`).join('')}</div><div class="why" ${st&&st.ok?'':'hidden'}>${x.w}</div></div>`}).join('')}</div>`}
function show(id,scroll){const c=CH.find(x=>x.id===id)||CH[0];ST.cur=c.id;saveST();const i=CH.indexOf(c),prev=CH[i-1],next=CH[i+1];
 let h=`<section class="ch on" id="ch-${c.id}"><div class="eyebrow">{{etape}}</div><h1>${c.t}</h1><p class="lead">${c.lead}</p>
 {{titre_regles}}<ol class="rules">${c.rules.map(x=>`<li>${x}</li>`).join('')}</ol>${typeof FIG!=='undefined'&&FIG[c.id]?`<figure class="fig">${FIG[c.id].svg}<figcaption>${FIG[c.id].cap}</figcaption></figure>`:''}${c.faq?`<div class="faq">{{faq_titre}}<ul>${c.faq.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}${c.html||''}${c.lab?`<div id="labhost">${LABS[c.lab].html()}</div>`:''}`;
 if(c.cas&&c.cas.length){{titre_cas}}${qBlock(c.cas,'c',c.id)}`;
 if(c.quiz&&c.quiz.length){{titre_verifier}}${qBlock(c.quiz,'q',c.id)}<div id="qscore" class="score"></div>`;
 h+=`<div id="donebox"></div><div class="pager">${prev?`<button type="button" data-go="${prev.id}">← ${prev.t}</button>`:'<span></span>'}${next?`<button type="button" class="pri" data-go="${next.id}">${next.t} →</button>`:`<button type="button" class="pri" {{bouton_ouvrir_aide}}`}</div></section>`;
 const R=$('#read');R.innerHTML=h;if(c.lab)LABS[c.lab].init($('#labhost'));
 const sc=$('#salles-ch');if(sc)sc.innerHTML={{aide_salles_section}}<div class="cards">${SALLES.filter(x=>x.s!=='?').map(roomCard).join('')}</div>{{aide_salles_aleatoires}}`;
 $$('.q',R).forEach(q=>$$('.opts button',q).forEach(b=>b.onclick=()=>{const k=q.dataset.k,a=+q.dataset.a,j=+b.dataset.j,st=ST.q[k]||(ST.q[k]={picked:[]});if(st.picked.includes(j))return;st.picked.push(j);
  b.classList.add(j===a?'right':'wrong');if(j===a){st.ok=true;if(st.picked.length===1)st.first=true}$('.why',q).hidden=false;
  if(j!==a){$('.why',q).innerHTML={{reponse_fausse}};$('.why',q).hidden=false}else $('.why',q).innerHTML=(q.classList.contains('case')?c.cas:c.quiz)[+k.split(':')[1].slice(1)].w;
  saveST();check(c)}));
 $$('[data-go]',R).forEach(b=>b.onclick=()=>show(b.dataset.go,true));$$('[data-tab]',R).forEach(b=>b.onclick=e=>{e.preventDefault();tab(b.dataset.tab)});
 check(c);toc();progress();if(location.hash!=='#'+c.id)history.replaceState(null,'','#'+c.id);if(scroll)window.scrollTo(0,0)}
function check(c){const all=[...(c.quiz||[]).map((_,i)=>`${c.id}:q${i}`),...(c.cas||[]).map((_,i)=>`${c.id}:c${i}`)];const ok=all.filter(k=>ST.q[k]&&ST.q[k].ok).length,first=all.filter(k=>ST.q[k]&&ST.q[k].first).length;
 const sc=$('#qscore');if(sc)sc.textContent=ok?{{bilan_quiz}}:'';
 if(ok===all.length&&all.length&&!ST.done[c.id]){ST.done[c.id]=1;saveST();toc();progress()}
 $('#donebox').innerHTML=ST.done[c.id]?{{chapitre_valide}}:''}
$('#tocbtn').onclick=()=>{const o=$('#toc').classList.toggle('open');$('#tocbtn').setAttribute('aria-expanded',o);{{sommaire_basculer}}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(CH.some(c=>c.id===id)&&id!==ST.cur){tab('learn');show(id,true)}});

<!--CONTENU:aide-->/* ---------- onglet Salles ---------- */
function salles(){$('#sallespage').innerHTML=`{{salles_entete}}
 <div class="filters2"><div class="seg" id="sl-s">${['tout','A','B','C','?'].map((v,i)=>`<button type="button" data-v="${v}" class="${i?'':'sel'}">{{salles_filtres}}</button>`).join('')}</div><input type="search" id="sl-q" {{salles_recherche}}></div>
 {{salles_legende}}<div class="cards" id="sl-cards"></div>`;
 let s='tout';const norm=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/<[^>]+>/g,'');
 const draw=()=>{const q=norm($('#sl-q').value||'');$('#sl-cards').innerHTML=SALLES.filter(x=>(s==='tout'||x.s===s)&&(!q||norm(x.fr+' '+x.fx+' '+x.pr.join(' ')).includes(q))).map(roomCard).join('')||{{salles_aucune}}};
 $$('#sl-s button').forEach(b=>b.onclick=()=>{$$('#sl-s button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');s=b.dataset.v;draw()});$('#sl-q').oninput=draw;draw()}

/* ---------- onglets, thème, démarrage ---------- */
function tab(t){$$('.lrmp-onglets button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));$$('.tab').forEach(x=>x.classList.toggle('on',x.id==='tab-'+t));LS.set('nemr-tab',t);window.scrollTo(0,0)}
$$('.lrmp-onglets button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
const TH=['auto','dark','light'];let th=LS.get('nemr-theme','auto');
const applyTh=()=>{if(th==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',th);{{theme_titre}}};
$('#theme').onclick=()=>{th=TH[(TH.indexOf(th)+1)%3];LS.set('nemr-theme',th);applyTh()};applyTh();
aide();salles();
const h=location.hash.slice(1);show(CH.some(c=>c.id===h)?h:ST.cur,false);
if(!CH.some(c=>c.id===h))tab(LS.get('nemr-tab','learn'));
})();
</script>
