<!DOCTYPE html>
<html lang="{{_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titre}}</title>
<!--polices:Figtree,Marcellus-->
<link rel="stylesheet" href="../commun/polices.css">
<link rel="preload" href="../commun/polices/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../commun/polices/marcellus-latin.woff2" as="font" type="font/woff2" crossorigin>
<!--/polices-->
<style>
/* Une seule page : une barre de navigation commune, puis le tutoriel (Apprendre) ou le compagnon (Jouer), chacun avec ses styles isolés. */
:root{--app-accent:var(--gold);--app-accent-ink:var(--gold-ink);--app-piste:var(--sunk);--app-onglet:var(--muted);color-scheme:dark;--bg:#0a0f18;--ink:#efe6d2;--muted:#9eabbd;--line:#26324a;--gold:#d9b66c;--gold-ink:#141a26;--sunk:#0e1520;
 --f-display:'Marcellus','Palatino Linotype',Georgia,serif;--f-body:'Figtree','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:var(--f-body);min-height:100vh;
 background:radial-gradient(ellipse 110% 300px at 50% -70px,rgba(84,160,232,.40),rgba(40,92,170,.14) 55%,transparent 80%) no-repeat,var(--bg)}
.topbar{max-width:1320px;margin:0 auto;padding:14px 16px 4px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.03em;margin:0;font-weight:400}
.brand small{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--muted);letter-spacing:0}
/* Boutons inactifs : clairement éteints, jamais dorés */
.app button:disabled,.app button.primary:disabled,.app button.on:disabled{opacity:1;background:transparent!important;color:#6b778a!important;border:1px dashed #33405a!important;box-shadow:none!important;cursor:not-allowed}
.app .stp button:disabled{border-style:solid!important;opacity:.5}
.app-tuto .why{margin:6px 0 0;font-size:.9rem;color:var(--muted);border-left:3px solid var(--gold);padding:2px 0 2px 10px}
.app[hidden]{display:none}
@media (max-width:480px){.topbar{justify-content:center;text-align:center}}
.app-tuto{
  
  --bg:#e6ebee; --panel:#f8fafb; --ink:#1b2931; --muted:#566772; --line:#c6d0d7;
  --accent:#0e6b78; --accent-ink:#ffffff; --gold:#a97a0f; --good:#2b7a4b; --bad:#b03b2b;
  --m-r:#c8452f; --m-g:#3f8f4a; --m-b:#2f6fb8; --m-w:#fbfbf5; --m-gold:#d9a826; --m-black:#2a2a30;
  --t-plaine:#bcd492; --t-collines:#cdb682; --t-foret:#69a36c; --t-desol:#aaa099; --t-desert:#e8d292;
  --t-marais:#86a394; --t-lac:#86b9d8; --t-montagne:#9597a1; --t-fog:#d3dae0; --hexline:#52636e;
  --f-display:'Alegreya SC',Georgia,serif; --f-body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
}
.app-tuto *{box-sizing:border-box}
.app-tuto,.app-tuto{margin:0}
.app-tuto{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.app-tuto h1,.app-tuto h2,.app-tuto h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.02em}
.app-tuto h1{font-size:1.6rem}
.app-tuto h2{font-size:1.15rem}
.app-tuto h3{font-size:1rem}
.app-tuto p{margin:0}
.app-tuto button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:.35rem .7rem}
.app-tuto button:hover:not(:disabled){border-color:var(--accent)}
.app-tuto button:focus-visible,.app-tuto [tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app-tuto button:disabled{opacity:.45;cursor:not-allowed}
.app-tuto button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.app-tuto .wrap{max-width:1320px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.app-tuto header.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
.app-tuto header.top p{color:var(--muted);font-size:.92rem;max-width:65ch}
.app-tuto nav.lessons{display:flex;flex-wrap:wrap;gap:6px}
.app-tuto nav.lessons button{font-size:.9rem;padding:.3rem .65rem;border-radius:999px}
.app-tuto nav.lessons button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.app-tuto nav.lessons button.ok::after{content:" ✓";color:var(--good)}
.app-tuto nav.lessons button.cur.ok::after{color:var(--accent-ink)}
.app-tuto .board{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr) minmax(240px,300px);gap:14px;align-items:start}
@media (max-width:1050px){.app-tuto .board{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.app-tuto .board .mapbox{grid-column:1 / -1;order:-1}}
@media (max-width:640px){.app-tuto .board{grid-template-columns:minmax(0,1fr)}}
.app-tuto .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.app-tuto .coach .step{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.app-tuto .coach .txt{display:flex;flex-direction:column;gap:8px}
.app-tuto .coach .txt b{color:var(--accent)}
.app-tuto .goal{border-left:4px solid var(--gold);padding:6px 10px;background:color-mix(in srgb,var(--gold) 10%,transparent);border-radius:0 6px 6px 0}
.app-tuto .goal.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.app-tuto .goal .lab{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.app-tuto details.hint summary{cursor:pointer;color:var(--accent);font-weight:500}
.app-tuto details.hint p{margin-top:6px;color:var(--muted)}
.app-tuto .log{font-size:.9rem;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.app-tuto .log div{color:var(--muted)}
.app-tuto .log div:first-child{color:var(--ink);font-weight:500}
.app-tuto .log div.bad:first-child{color:var(--bad)}
.app-tuto .log div.good:first-child{color:var(--good)}
.app-tuto .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.app-tuto .mapbox{padding:8px}
.app-tuto .mapbox svg{width:100%;height:auto;display:block}
.app-tuto .mapbar{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center;padding:4px 6px;font-size:.92rem}
.app-tuto .daynight{font-weight:700}
.app-tuto .hex{cursor:pointer}
.app-tuto .hex polygon{stroke:var(--hexline);stroke-width:1.5}
.app-tuto .hex:hover polygon.base{filter:brightness(1.08)}
.app-tuto .hex .reach{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:6 5;pointer-events:none}
.app-tuto .hex .target{fill:none;stroke:var(--gold);stroke-width:5;pointer-events:none}
.app-tuto .hex text{font-family:var(--f-body);pointer-events:none}
.app-tuto .hex .cost{font-size:13px;font-weight:700;fill:#12202a;opacity:.75}
.app-tuto .hex .lbl{font-size:10.5px;font-weight:700;fill:#12202a}
.app-tuto .stat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums}
.app-tuto .stat span:nth-child(odd){color:var(--muted)}
.app-tuto .stat span:nth-child(even){font-weight:700;text-align:right}
.app-tuto .sub{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.app-tuto .gem{display:inline-block;width:15px;height:15px;border-radius:3px;border:1.5px solid rgba(0,0,0,.45);vertical-align:-2px;transform:rotate(45deg) scale(.8)}
.app-tuto .die{display:inline-flex;width:30px;height:30px;border-radius:6px;border:2px solid rgba(0,0,0,.5);align-items:center;justify-content:center;font-size:.7rem;font-weight:700}
.app-tuto .tok{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.45);vertical-align:-3px}
.app-tuto .mc-r{background:var(--m-r)}
.app-tuto .mc-g{background:var(--m-g)}
.app-tuto .mc-b{background:var(--m-b)}
.app-tuto .mc-w{background:var(--m-w)}
.app-tuto .mc-gold{background:var(--m-gold)}
.app-tuto .mc-black{background:var(--m-black)}
.app-tuto .die.off{opacity:.35;text-decoration:line-through}
.app-tuto .die.used{opacity:.3}
.app-tuto .pools{display:flex;flex-wrap:wrap;gap:6px}
.app-tuto .pool{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.app-tuto .pool b{font-size:1.1rem}
.app-tuto .pool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.app-tuto .unit{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.app-tuto .unit.spent{opacity:.55}
.app-tuto .unit.wounded{border-color:var(--bad)}
.app-tuto .unit .row{justify-content:space-between}
.app-tuto .enemy{border:2px solid var(--bad);border-radius:8px;padding:8px}
.app-tuto .tag{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-right:4px}
.app-tuto ol.phases{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:.78rem;text-align:center}
.app-tuto ol.phases li{border:1px solid var(--line);border-radius:5px;padding:3px 2px;color:var(--muted)}
.app-tuto ol.phases li.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.app-tuto ol.phases li.past{text-decoration:line-through}
.app-tuto .handbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.app-tuto .hand{display:flex;flex-wrap:wrap;gap:10px}
.app-tuto .card{width:168px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.app-tuto .card .band{height:8px}
.app-tuto .card .in{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.app-tuto .card .cname{font-family:var(--f-display);font-weight:700}
.app-tuto .card .eff{font-size:.86rem}
.app-tuto .card .eff i{font-style:normal;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;display:block}
.app-tuto .card .btns{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:auto}
.app-tuto .card .btns button{font-size:.8rem;padding:.25rem .2rem}
.app-tuto .card .btns button.side{grid-column:1 / -1}
.app-tuto .card.wound{border-color:var(--bad)}
.app-tuto .card.wound .band{background:var(--bad)}
.app-tuto .card.wound .in{color:var(--muted)}
.app-tuto .playedzone{font-size:.88rem;color:var(--muted)}
.app-tuto .modal{position:fixed;inset:0;background:rgba(8,14,18,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.app-tuto .modal[hidden]{display:none}
.app-tuto .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px}
.app-tuto .modal .opts{display:flex;flex-direction:column;gap:6px}
.app-tuto .modal .opts button{text-align:left}
.app-tuto .modal .opts small{display:block;color:var(--muted)}
.app-tuto .courselay{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.app-tuto .courselay.free{grid-template-columns:minmax(0,1fr)}
.app-tuto .coursemain,.app-tuto .stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.app-tuto .stack:empty{display:none}
.app-tuto #side-nav{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:8px;max-height:92vh;overflow:auto}
.app-tuto #side-nav[hidden],.app-tuto #c-top[hidden],.app-tuto #c-bot[hidden]{display:none}
.app-tuto #side-nav button{display:flex;gap:8px;align-items:baseline;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;font-size:.95rem}
.app-tuto #side-nav button:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.app-tuto #side-nav button.cur{background:var(--accent);color:var(--accent-ink);font-weight:700}
.app-tuto #side-nav .n{font-size:.75rem;width:18px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.app-tuto #side-nav button.cur .n,.app-tuto #side-nav button.cur .tick{color:inherit}
.app-tuto #side-nav .tick{margin-left:auto;color:var(--good);font-weight:700}
.app-tuto .part{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 8px 2px}
.app-tuto .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:2px 6px}
.app-tuto .bar i{display:block;height:100%;background:var(--gold)}
.app-tuto .barlabel{font-size:.8rem;color:var(--muted);margin:2px 6px 4px}
@media (max-width:900px){.app-tuto .courselay{grid-template-columns:minmax(0,1fr)}
.app-tuto #side-nav{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;align-items:center}
.app-tuto .part,.app-tuto .bar,.app-tuto .barlabel{flex-basis:100%}
.app-tuto #side-nav button{border:1px solid var(--line);padding:3px 8px}}
.app-tuto .eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.app-tuto .chtitle{font-size:1.5rem}
.app-tuto dl.glo{margin:0;max-width:70ch}
.app-tuto dl.glo dt{font-weight:700;margin-top:10px}
.app-tuto dl.glo dd{margin:0;color:var(--muted)}
.app-tuto .casetabs{display:flex;flex-wrap:wrap;gap:6px}
.app-tuto .casetabs button{border-radius:999px;font-size:.92rem}
.app-tuto .casetabs button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.app-tuto .casetabs button.ok::after{content:" ✓";color:var(--good)}
.app-tuto .casetabs button.cur.ok::after{color:inherit}
.app-tuto .arena,.app-tuto .story{display:flex;flex-direction:column;gap:10px}
.app-tuto .sitelbl{font-weight:700;color:var(--gold)}
.app-tuto .foes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.app-tuto .foe{display:flex;flex-direction:column;gap:3px;text-align:left;border:2px solid var(--bad);border-radius:8px;padding:8px;min-height:92px}
.app-tuto .foe.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.app-tuto .foe.dead{opacity:.45;border-style:dashed}
.app-tuto .foe em{font-style:normal;font-weight:700;color:var(--accent);min-height:1.3em}
.app-tuto .unitb{text-align:left}
.app-tuto .unitb.w{border-color:var(--bad)}
.app-tuto .chipb{border-radius:8px;padding:.5rem .8rem}
.app-tuto .chipb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.app-tuto .chipb.wd{border-color:var(--bad)}
.app-tuto .sit{font-size:1.05rem;max-width:68ch}
.app-tuto .muted{color:var(--muted)}
.app-tuto .between{justify-content:space-between}
.app-tuto .board{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
.app-tuto .board .mapbox{grid-column:1 / -1;order:-1}
@media (max-width:640px){.app-tuto .board{grid-template-columns:minmax(0,1fr)!important}}
.app-tuto .chap{display:flex;flex-wrap:wrap;gap:6px}
.app-tuto .chap button{font-family:var(--f-display);font-weight:700;padding:.45rem .9rem}
.app-tuto .chap button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.app-tuto #ch1{display:flex;flex-direction:column;gap:14px}
.app-tuto #ch1[hidden],.app-tuto #ch2[hidden]{display:none}
.app-tuto #ch2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.app-tuto #ch2{grid-template-columns:minmax(0,1fr)}}
.app-tuto ul.rules{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:7px;max-width:68ch}
.app-tuto .q{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.app-tuto .opts2{display:flex;flex-direction:column;gap:5px}
.app-tuto .opts2 button{text-align:left}
.app-tuto .opts2 button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent);font-weight:700}
.app-tuto .opts2 button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.app-tuto .fb.good{color:var(--good)}
.app-tuto .fb.bad{color:var(--bad)}
.app-tuto .lab{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.app-tuto .lab button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.app-tuto .labgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px}
.app-tuto .labgrid>div{display:flex;justify-content:space-between;align-items:center;gap:6px}
.app-tuto .labgrid small{color:var(--muted)}
.app-tuto .stepper{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.app-tuto .stepper button{padding:0 .55rem;line-height:1.5}
.app-tuto .stepper b{min-width:1.4em;text-align:center}
.app-tuto .verdict.yes{color:var(--good)}
.app-tuto .verdict.no{color:var(--bad)}
.app-tuto section.ref{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.app-tuto section.ref .panel{font-size:.94rem}
.app-tuto section.ref ul,.app-tuto section.ref ol{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:3px}
.app-tuto table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.app-tuto th,.app-tuto td{text-align:left;padding:2px 6px;border-bottom:1px solid var(--line)}
.app-tuto td.n,.app-tuto th.n{text-align:right}
.app-tuto footer{color:var(--muted);font-size:.85rem;max-width:80ch}
@media (prefers-reduced-motion:no-preference){.app-tuto .card{transition:transform .12s}
.app-tuto .card:hover{transform:translateY(-2px)}}
.app-tuto{color-scheme:dark;background:transparent;font-size:16px;
 --bg:#0a0f18; --panel:#131b28; --ink:#efe6d2; --muted:#9eabbd; --line:#26324a;
 --accent:#d9b66c; --accent-ink:#141a26; --gold:#d9b66c; --good:#7fb565; --bad:#e2705a;
 --t-plaine:#7d9659; --t-collines:#8f7c52; --t-foret:#3f6f45; --t-desol:#6f6862; --t-desert:#a8955c;
 --t-marais:#52705f; --t-lac:#447a9c; --t-montagne:#5e606b; --t-fog:#1c2738; --hexline:#0a0f18;
 --f-display:'Marcellus','Palatino Linotype',Georgia,serif; --f-body:'Figtree','Segoe UI',system-ui,sans-serif}
.app-tuto h1,.app-tuto h2,.app-tuto h3{font-weight:400}
.app-tuto button{border-radius:10px}
.app-tuto .panel{border-radius:14px}

.app-comp{
  
  color-scheme:dark;
  --bg:#0a0f18; --panel:#131b28; --sunk:#0e1520; --ink:#efe6d2; --muted:#9eabbd; --line:#26324a;
  --gold:#d9b66c; --gold-2:#c39d4f; --gold-ink:#141a26;
  --gem:#6ea6e6; --relic:#7fb565; --spell:#c98552; --bad:#e2705a;
  --m-r:#c9432f; --m-g:#3d8f4b; --m-b:#2f6fb8; --m-w:#f2efe2;
  --f-display:'Marcellus','Palatino Linotype',Georgia,serif; --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
.app-comp *{box-sizing:border-box}
.app-comp,.app-comp{margin:0}
.app-comp{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  background:transparent}
.app-comp h1,.app-comp h2,.app-comp h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
.app-comp h2{font-size:1.25rem}
.app-comp p{margin:0}
.app-comp .wrap{max-width:560px;margin:0 auto;padding:0 16px 24px;display:flex;flex-direction:column;gap:12px}

<script>(()=>{"use strict";


const APPROOT=document.getElementById("app-tuto");const $=s=>APPROOT.querySelector(s);
<!--CONTENU:plateau-->
<!--CONTENU:chapitres-->

<!--CONTENU:ateliers-->
window.mkChap=c=>{if(CH!==c){CH=c;render()}};
function render(){const free=CH==='free';
  if(S&&BOARD>=0&&BOARD!==7&&LESSONS[BOARD].ok(S))winCase('L'+BOARD);
  if(free&&BOARD!==7){BOARD=7;setupBoard(7)}
  $('#side-nav').hidden=free;$('#c-top').hidden=free;$('#c-bot').hidden=free;$('#courselay').classList.toggle('free',free);
  let board=free;if(!free){renderCourse();const id=activeCase();board=!!id&&CASES[id].type==='board'}
  $('#ch1').hidden=!board;if(board){renderMap();renderSide();renderHand();renderCoach()}
  renderNav()}


APPROOT.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-hex]');if(!t||t.disabled)return;const d=t.dataset;
  if(d.chap){const m=d.chap==='free'?'libre':'apprendre';const a=document.querySelector('.modes a[data-mode="'+m+'"]');if(a)a.click();return}
  if(d.topic!==undefined){TI=+d.topic;CH='course';persist();render();return $('#courselay').scrollIntoView({block:'start'})}
  if(d.case){ACT[TI]=d.case;const c=CASES[d.case];if(c.type==='board'){BOARD=c.li;setupBoard(c.li)}return render()}
  if(d.ans){const [j,k]=d.ans.split(':');ANS[TI][+j]=+k;persist();return render()}
  if(d.lab)return labAct(d.lab);
  if(d.ar){if(d.ar==='restart'){arStart(AR.id);return render()}if(AR.over)return;return d.ar==='attack'?arAttack():d.ar==='block'?arBlock():d.ar==='next'?arNext():d.ar==='hero'?arHero():arEnd()}
  if(d.foe!==undefined)return arEnemy(+d.foe);
  if(d.aunit!==undefined)return arUnit(+d.aunit);
  if(d.ap)return arPlay(+d.uid,d.ap);
  if(d.st!==undefined){if(d.st==='restart'){stStart(ST.id);return render()}if(d.st==='next'){ST.i++;ST.pick=null;if(ST.i>=ST.d.steps.length)winCase(ST.id);return render()}ST.pick=+d.st;return render()}
  if(d.sl!==undefined){if(d.sl==='go'){SL.fb=SL.d.check([...SL.sel].sort().map(i=>SL.d.items[i]));if(SL.fb[0])winCase(SL.id);return render()}const i=+d.sl;SL.sel.has(i)?SL.sel.delete(i):SL.sel.add(i);SL.fb=null;return render()}
  if(d.lesson!==undefined){setupBoard(LI);return render()}
  if(d.hex)clickHex(d.hex);
  else if(d.play)playCard(+d.uid,d.play);
  else if(d.cb)combatAct(d.cb);
  else if(d.unit!==undefined)clickUnit(+d.unit);
  else if(d.recruit)recruit(d.recruit);
  else if(d.heal)buyHeal();
  else if(d.den)denFight();
  else if(d.act==='end')endTurn(false);
  else if(d.act==='rest')rest();
  else if(d.act==='round')endRound();
});
render();

})();</script>

<script>
(()=>{const modes=['apprendre','libre','jouer','aide'];
 function show(m){if(!modes.includes(m))m='jouer';document.documentElement.setAttribute('data-mode',m);document.getElementById('app-tuto').hidden=m!=='apprendre'&&m!=='libre';if(window.mkChap)window.mkChap(m==='libre'?'free':'course');document.getElementById('app-comp').hidden=m!=='jouer';document.getElementById('app-aide').hidden=m!=='aide';
  document.querySelectorAll('.modes a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.mode===m)&&a.setAttribute('aria-current','page'));
  try{localStorage.setItem('mk-mode',m)}catch(e){}}
 let start=location.hash.slice(1);if(!modes.includes(start)){try{start=localStorage.getItem('mk-mode')||'jouer'}catch(e){start='jouer'}}
 show(start);
 window.addEventListener('hashchange',()=>{show(location.hash.slice(1));window.scrollTo(0,0)});
 document.querySelectorAll('.modes a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();show(a.dataset.mode);if(location.hash!=='#'+a.dataset.mode)history.replaceState(null,'','#'+a.dataset.mode);window.scrollTo(0,0)}));
})();
</script>
