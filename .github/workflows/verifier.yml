# Vérifie le site à chaque push (outils/verifier.py) : pages, liens, sitemap, langues, poids, cache, vouvoiement, HTML.
# Une erreur fait échouer la vérification (croix rouge sur le commit) ; la publication GitHub Pages n'est pas bloquée.
name: Vérifier le site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g html-validate@9
      - run: python3 outils/verifier.py
